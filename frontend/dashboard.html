<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МИРЭА Диспетчер - Заявки</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>Заявки на обслуживание</h1>
                <button onclick="logout()" class="btn-secondary">Выйти</button>
            </div>
            
            <div class="role-info" id="role-info"></div>
            
            <div class="actions">
                <button onclick="location.href='create-ticket.html'" class="btn-primary">+ Новая заявка</button>
                <button onclick="loadTickets()" class="btn-secondary">🔄 Обновить</button>
            </div>

            <div id="tickets-list" class="tickets-list">
                <div class="loading">Загрузка...</div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
